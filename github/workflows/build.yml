
name: Build ANTO Waifu APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ANTO_Waifu_Sagiri_Sprite.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q ANTO_Waifu_Sagiri_Sprite.zip -d source
          find source -name settings.gradle.kts

      - name: Build APK
        run: |
          cd "$(dirname "$(find source -name settings.gradle.kts | head -n 1)")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTO-Waifu-APK
          path: source/**/build/outputs/apk/debug/*.apk
          
