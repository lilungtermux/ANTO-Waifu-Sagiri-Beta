
name: Build ANTO Waifu Sagiri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q ANTO_Waifu_Sagiri_Sprite.zip -d project

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name gradlew | head -n 1)")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTO-Waifu-Sagiri-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
